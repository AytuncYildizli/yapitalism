[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yapitalism"
version = "0.1.0"
description = "Evidence-backed reliability for voice-driven agent work"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Aytunc Yildizli"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]

dependencies = [
  # The MCP server is the product; without this an install imports and then
  # dies at runtime, which is what shipping no dependencies at all did.
  "fastmcp>=3.1,<4",
]

[project.optional-dependencies]
# One source of dependency truth. A hand-kept requirements-dev.txt beside
# pyproject drifts, and drift is how "no declared dependencies at all" survived
# to a public repo.
dev = [
  "build==1.4.0",
  "ruff==0.15.10",
]

[project.urls]
Homepage = "https://yapitalism.com"
Source = "https://github.com/AytuncYildizli/yapitalism"

[project.scripts]
yapitalism = "yapitalism.cli:main"
# The install has to give people the server, not just the receipt CLI.
yapitalism-mcp = "yapitalism.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
