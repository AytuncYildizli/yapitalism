name: Release

# Publishing is deliberately tag-driven and manual-dispatchable, never on push
# to main: a merge should not be able to burn a version number. PyPI refuses a
# re-upload of a version that already exists, so an accidental publish is not
# something you can take back.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the package as a user would
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Validate server.json against the registry schema
        run: python scripts/validate-server-json.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build
      - name: Refuse to publish a .dev version by accident
        # pyproject carries a .dev suffix during development. Shipping that to
        # PyPI as a release is a mistake you cannot undo, so fail loudly here.
        run: |
          version=$(ls dist/*.tar.gz | sed -E 's/.*yapitalism-(.+)\.tar\.gz/\1/')
          echo "built version: $version"
          case "$version" in
            *dev*) echo "::error::refusing to release a .dev version ($version)"; exit 1 ;;
          esac
      - name: Check the artifacts are well formed
        run: |
          python -m pip install --disable-pip-version-check twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Matches the Environment name registered with PyPI's trusted publisher.
    environment: pypi
    permissions:
      # The whole point of trusted publishing: GitHub mints a short-lived OIDC
      # token for this job and PyPI verifies it. There is no API token stored
      # anywhere, so there is none to leak or rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Makes a re-run idempotent. The registry step below can fail on its
          # own (it did, on a description length rule), and re-running the
          # workflow must not then die because PyPI already has the version.
          skip-existing: true

  registry:
    # The MCP Registry stores metadata only and verifies that the PyPI package
    # is really ours, so it can only run once the package is actually on PyPI.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Same OIDC mechanism as PyPI: mcp-publisher exchanges a short-lived
      # GitHub token for the io.github.AytuncYildizli/* namespace. No secret.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar -xz mcp-publisher
          ./mcp-publisher --help >/dev/null
      - name: Wait for PyPI to serve the new version
        # Ownership is verified by reading the package description off PyPI, so
        # publishing here before the index has caught up fails for a reason
        # that looks like a permissions problem and is not.
        run: |
          version=$(python -c "import json;print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/yapitalism/$version/json" >/dev/null; then
              echo "pypi has $version"; exit 0
            fi
            sleep 10
          done
          echo "::error::pypi did not serve $version in time"; exit 1
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # The Releases page is what a visitor actually sees; tags alone leave it
  # frozen on whatever release was last created by hand. Found mid-launch,
  # showing "0.2.0 · Latest" while 0.2.8 was live on PyPI.
  github-release:
    needs: [registry]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${GITHUB_REF_NAME#v}" \
            --generate-notes --latest \
            || echo "release already exists; leaving it alone"
