name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the package as a user would
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Doctor replay
        run: python -m yapitalism.cli doctor fixtures/stuck-revision.json
      - name: Build wheel
        run: python -m build --wheel
