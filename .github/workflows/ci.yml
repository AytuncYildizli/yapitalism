name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the package as a user would
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Doctor runs without a server and says so
        # The live doctor's job is a report, not a gate: with no server in CI it
        # must still exit 0 and name what is missing rather than crash.
        run: python -m yapitalism.cli doctor
      - name: Build wheel
        run: python -m build --wheel
